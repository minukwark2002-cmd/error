<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ERROR — 죽음 이후의 회고</title>
  <meta name="description" content="이찬혁 『ERROR』에서 영감을 받은, 죽음 이후 나를 돌아보는 8개의 장면">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <section id="intro" class="screen">
      <p class="eyebrow">이찬혁 『ERROR』에서 영감을 받은 회고</p>
      <h1 class="glitch" data-text="ERROR">ERROR</h1>
      <p class="line l1">어느 날, 당신의 시간이 멈췄습니다.</p>
      <p class="line l2 big">죽음은 삶의 오류일까요,<br>아니면 삶을 완성하는 마지막 문장일까요?</p>
      <p class="line l3">당신은 지금까지 어떤 인생을 살았나요?</p>
      <button id="start" class="primary line l4">기억 되감기 시작</button>
      <p class="meta line l4">8개의 장면 · 약 2분</p>
    </section>

    <section id="quiz" class="screen" hidden>
      <div class="quiz-top">
        <button id="back" class="ghost" aria-label="이전 질문">← 이전</button>
        <span id="progress" aria-live="polite"></span>
      </div>
      <div class="bar"><div id="bar-fill"></div></div>
      <div id="q" class="q">
        <p id="scene" class="eyebrow"></p>
        <h2 id="question"></h2>
        <div id="options"></div>
      </div>
    </section>

    <section id="loading" class="screen" hidden>
      <h1 class="glitch" data-text="ERROR">ERROR</h1>
      <p class="line l1">당신의 파노라마를 되감는 중…</p>
    </section>

    <section id="result" class="screen" hidden>
      <p class="eyebrow">당신은,</p>
      <h2 id="r-name"></h2>
      <img id="r-img" alt="결과 이미지">
      <p class="hint">저장이 안 되면 이미지를 길게 눌러 저장하세요.</p>
      <p id="r-desc"></p>
      <div class="actions">
        <button id="download" class="primary">이미지 저장</button>
        <a id="r-track" class="ghost" target="_blank" rel="noopener"></a>
      </div>
      <h3>당신의 파노라마</h3>
      <ol id="r-panorama"></ol>
      <button id="restart" class="ghost">처음부터 다시</button>
    </section>
  </main>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
